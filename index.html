<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>黑白棋</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="board"></div>
        <script src="./out.js"></script>
        <script>
            const start_x = 1000, start_y = 500, grid_width = 60, grid_height = 60;
            // 0空，1白，2黑
            const piece_style = ["green", "white", "black"];
            const human_color=1;
            const AI_color=human_color^1;
            const human_turn = human_color;
            let board = new Array(64), sum_piece = [0,0];
            let turn = 1, is_get_pos = 1, is_end = 0;

            // worker对象
            const aiWorker = new Worker("./ai.worker.js");
            let workerReady = false;
            aiWorker.onmessage = function(e){
                if(e.data.type === "ready"){
                    workerReady = true;
                    // wasm初始化完成，初始化游戏
                    Module.ccall("c_init",null,[],[]);
                    update();
                }else if(e.data.type === "ai_result"){
                    // worker算完AI落子坐标 aiPos:0‑63；0代表pass
                    const pos = e.data.aiPos;
                    wasm_user_put(pos);
                    update();
                    is_get_pos = 1;
                }
            }

            // wasm_user_put 返回c++ c_put_piece()返回结果
            function wasm_user_put(pos){
                const ptr = Module._malloc(64*4);
                for(let i=0;i<64;i++){
                    Module.setValue(ptr+i*4, board[i],'i32');
                }
                const ret = Module.ccall("c_put_piece","number",["number","number","number","number","number"],[pos,ptr,turn,sum_piece[0],sum_piece[1]]);
                return ret!==0;
            }

            // wasm_AI_put：把当前board数组发给worker子线程执行AI计算
            function wasm_AI_put(){
                if(!workerReady) return;
                aiWorker.postMessage({type:"ai_calc", boardArr:board, turn:turn, sum0:sum_piece[0], sum1:sum_piece[1]});
            }

            // update函数：调用c++ get_turn get_board get_is_end get_sum_piece
            function update(){
                // 1 get turn
                turn = Module.ccall("get_turn","number",[],[]);

                // 2 get_board：分配内存读取64个int
                const boardPtr = Module._malloc(64*4);
                Module.ccall("get_board",null,["number"],[boardPtr]);
                for(let i=0;i<64;i++){
                    board[i] = Module.getValue(boardPtr + i*4, 'i32');
                }
                Module._free(boardPtr);

                //3 get_is_end
                is_end = Module.ccall("get_is_end","number",[],[]) !==0;

                //4 get_sum_piece
                const sumPtr = Module._malloc(2*4);
                Module.ccall("get_sum_piece",null,["number"],[sumPtr]);
                sum_piece[0] = Module.getValue(sumPtr + 0*4, 'i32');
                sum_piece[1] = Module.getValue(sumPtr + 1*4, 'i32');
                Module._free(sumPtr);

                paint_board();
            }
            function send_msg(x, y){
                if(!is_get_pos || turn != human_turn || is_end) return;
                console.log(x,y);
                is_get_pos = 0;
                if(wasm_user_put(x * 8 + y)){
                    console.log("Human successfully placed.");
                    update();
                    if(is_end) return;
                    wasm_AI_put();
                }
                else is_get_pos = 1;
            }
        </script>
        <script>
            function paint_piece(canvas_node, color){
                let c = canvas_node.getContext("2d");
                c.clearRect(0,0,canvas_node.width,canvas_node.height);
                c.beginPath();
                c.arc(grid_width/2,grid_height/2,15,0,2*Math.PI);
                c.fillStyle = color;
                c.fill();
            }
            function paint_board(){
                let k = 0;
                for(let i = 1; i <= 8; i++){
                    for(let j = 1; j <= 8; j++){
                        if(board[k] >= 0){//k>=0 means this pos is white or black
                            let canvas_node = document.getElementById(`canvas(${i},${j})`);
                            paint_piece(canvas_node, piece_style[board[k] + 1]);
                        }
                        k++;
                    }
                }
                let result_node = document.getElementById("result");
                
                if(is_end){
                    if(sum_piece[0] == sum_piece[1]) result_node.innerHTML = "平局！";
                    else if(sum_piece[0] > sum_piece[1]) result_node.innerHTML = "AI 赢了！";
                    else result_node.innerHTML = "你赢了！";
                }
            }
        </script>
        <script>
            let root = document.getElementById("board");
                    
            for(let i = 1; i <= 8; i++){
                for(let j = 1; j <= 8; j++){
                    let div_node = document.createElement("div");
                    div_node.className = "grid";
                    div_node.id = `div(${i},${j})`;
                    div_node.setAttribute("onclick",`send_msg(${i},${j})`);

                    let canvas_node = document.createElement("canvas");
                    canvas_node.id = `canvas(${i},${j})`;

                    canvas_node.width = grid_width;
                    canvas_node.height = grid_height;

                    div_node.appendChild(canvas_node);
                    root.appendChild(div_node);
                }
                let br_node = document.createElement("br");
                root.appendChild(br_node);
            }
        </script>
        <button class="pass" type="button" onclick="send_msg(0,0)">过</button>
        <div id="result" class="result"></div>
    </body>
</html>
